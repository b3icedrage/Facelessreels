name: Render Kids 3D Cartoon (Free Blender)

on:
  workflow_dispatch:
    inputs:
      idea:
        description: One-sentence funny adventure premise
        required: true
        type: string
      duration:
        description: Blueprint episode length in seconds
        required: true
        default: "240"
        type: choice
        options: ["180", "240", "300"]
      render_seconds:
        description: Render length for this run (start with a short preview)
        required: true
        default: "20"
        type: choice
        options: ["20", "60", "180", "240", "300"]

permissions:
  contents: read

jobs:
  render-cartoon:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install free offline production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg espeak-ng
          blender --version
          ffmpeg -version | head -n 1
          espeak-ng --version

      - name: Create offline episode blueprint
        env:
          EPISODE_IDEA: ${{ inputs.idea }}
          EPISODE_DURATION: ${{ inputs.duration }}
          OUTPUT_DIR: output/kids-production-${{ github.run_id }}
        run: |
          python -m facelessreels.kids_studio \
            --idea "$EPISODE_IDEA" \
            --duration "$EPISODE_DURATION" \
            --out "$OUTPUT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Prepare English narration
        env:
          RENDER_SECONDS: ${{ inputs.render_seconds }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["OUTPUT_DIR"])
          data = json.loads((folder / "episode_blueprint.json").read_text(encoding="utf-8"))
          limit = int(os.environ["RENDER_SECONDS"])
          lines = []
          for scene in data["scenes"]:
              if scene["start_seconds"] >= limit:
                  break
              lines.append(scene["narration"])
              lines.append(scene["dialogue"].replace("Pip:", "Pip says,").replace("Tilly:", "Tilly says,"))
          (folder / "narration.txt").write_text("\n".join(lines), encoding="utf-8")
          PY
          espeak-ng -v en-us+f3 -s 145 -f "$OUTPUT_DIR/narration.txt" -w "$OUTPUT_DIR/voiceover.wav"

      - name: Render original 3D cartoon with Blender
        env:
          RENDER_SECONDS: ${{ inputs.render_seconds }}
        run: |
          blender --background --python facelessreels/kids_blender_render.py -- \
            --blueprint "$OUTPUT_DIR/episode_blueprint.json" \
            --seconds "$RENDER_SECONDS" \
            --output "$OUTPUT_DIR/cartoon_silent.mp4"

      - name: Add voiceover and create final MP4
        env:
          RENDER_SECONDS: ${{ inputs.render_seconds }}
        run: |
          ffmpeg -y -i "$OUTPUT_DIR/cartoon_silent.mp4" -i "$OUTPUT_DIR/voiceover.wav" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 128k \
            -af "apad,atrim=0:$RENDER_SECONDS" -t "$RENDER_SECONDS" \
            -movflags +faststart "$OUTPUT_DIR/kids_cartoon.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 \
            "$OUTPUT_DIR/kids_cartoon.mp4"

      - name: Save MP4 and editable production files
        uses: actions/upload-artifact@v4
        with:
          name: kids-3d-cartoon-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 7
