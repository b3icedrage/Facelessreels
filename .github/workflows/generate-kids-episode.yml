name: Generate Kids Episode Script

on:
  workflow_dispatch:
    inputs:
      idea:
        description: One-sentence funny adventure premise
        required: true
        type: string
      duration:
        description: Episode duration in seconds (180–300)
        required: true
        default: "240"
        type: string
      mode:
        description: Choose offline-only to avoid all NVIDIA API requests
        required: true
        default: offline
        type: choice
        options:
          - offline
          - nvidia_with_offline_fallback

permissions:
  contents: read

jobs:
  generate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      FACELESSREELS_NVIDIA_MODEL: ${{ vars.FACELESSREELS_NVIDIA_MODEL || 'minimaxai/minimax-m3.1-flash' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate secret and inputs
        shell: bash
        env:
          EPISODE_IDEA: ${{ inputs.idea }}
          EPISODE_DURATION: ${{ inputs.duration }}
          GENERATION_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GENERATION_MODE" = "nvidia_with_offline_fallback" ] && [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Add NVIDIA_API_KEY under Settings > Secrets and variables > Actions, or select offline mode."
            exit 1
          fi
          python - <<'PY'
          import os
          duration = int(os.environ["EPISODE_DURATION"])
          if not 180 <= duration <= 300:
              raise SystemExit("Duration must be between 180 and 300 seconds.")
          if not os.environ.get("EPISODE_IDEA", "").strip():
              raise SystemExit("Episode idea is required.")
          PY
      - name: Generate script and 3D shot list
        env:
          EPISODE_IDEA: ${{ inputs.idea }}
          EPISODE_DURATION: ${{ inputs.duration }}
          GENERATION_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GENERATION_MODE" = "offline" ]; then
            echo "Offline-only mode selected; no NVIDIA API request will be made."
            python -m facelessreels.kids_studio \
              --idea "$EPISODE_IDEA" \
              --duration "$EPISODE_DURATION"
          elif python -m facelessreels.kids_studio_ai \
            --idea "$EPISODE_IDEA" \
            --duration "$EPISODE_DURATION"; then
            echo "NVIDIA script generation succeeded."
          else
            echo "::warning::NVIDIA generation failed. Creating a local offline script fallback; no second API request will be made."
            python -m facelessreels.kids_studio \
              --idea "$EPISODE_IDEA" \
              --duration "$EPISODE_DURATION"
          fi
      - name: Save generated episode as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-episode-script
          path: output/kids-*/
          if-no-files-found: error
          retention-days: 7
