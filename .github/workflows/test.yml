name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check agent CLI
        run: python -m facelessreels.agent --help
      - name: Check reel generator CLI
        run: python -m facelessreels.reels --help
      - name: Smoke-test offline reel pack generation
        run: |
          python -m facelessreels.reels generate --topic "CI smoke test" --out /tmp/facelessreels-ci-smoke
          test -s /tmp/facelessreels-ci-smoke/script.txt
          test -s /tmp/facelessreels-ci-smoke/captions.srt
          test -s /tmp/facelessreels-ci-smoke/reel.json
